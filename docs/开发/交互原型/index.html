<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G-Collie · 同源 Flutter 原型</title><link rel="stylesheet" href="prototype.css"></head>
<body><aside><strong>G-Collie</strong><h1>同源 Flutter 原型</h1><p>直接编译当前 App 的页面组件，不再用 HTML 重画手机界面。数据为模拟数据。</p><label>起始页面<select id="page"><option value="home">工作台</option><option value="chat">原会话聊天</option><option value="pair">连接与配对</option></select></label><label>演示状态<select id="state"><option value="normal">正常</option><option value="readonly">只读设备</option><option value="offline">电脑断线</option><option value="empty">空列表</option></select></label><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reload">重新开始</button><p class="note">切换条件会重新加载演示。配对码：123456；地址可填 http://preview.invalid。</p><p class="note">页面组件与 App 源码逐字节校验。浏览器字体、渲染和 Android 系统能力仍可能不同；原生授权、通知、文件阅读和视频上传需要真机核对，不在浏览器仿造。</p><a href="README.md">范围与校验记录</a></aside><main><iframe id="preview" title="G-Collie Flutter 页面" src="flutter/index.html?page=home&state=normal&theme=light"></iframe></main>
<script>
const frame=document.getElementById('preview');
function reload(){const params=new URLSearchParams();for(const id of ['page','state','theme'])params.set(id,document.getElementById(id).value);frame.src='flutter/index.html?'+params.toString()}
for(const id of ['page','state','theme'])document.getElementById(id).addEventListener('change',reload);
document.getElementById('reload').onclick=reload;
</script></body></html>
