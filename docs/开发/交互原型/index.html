<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G-Collie · 同源 Flutter 原型</title><link rel="stylesheet" href="prototype.css"></head>
<body><aside><strong>G-Collie</strong><h1>同源 Flutter 原型</h1><p><a href="web.html">查看电脑网页原型 ↗</a></p><p>查看 App 页面与交互细节，数据均为演示。</p><label>起始页面<select id="page"><option value="home">会话首页</option><option value="chat">Codex 会话</option><option value="hermes">Hermes 会话与添加菜单</option><option value="claude">Claude Code 会话</option><option value="video">Hermes 视频／封面与播放</option><option value="approval">Hermes 批准／拒绝</option><option value="question">回答问题</option><option value="secret">安全输入</option><option value="attachments">添加附件菜单</option><option value="new">新建会话设置</option><option value="sessions">侧栏与搜索</option><option value="filters">会话筛选</option><option value="projects">项目管理</option><option value="usage">用量统计与重置卡</option><option value="workspace">我的工作台</option><option value="profile">资料设置</option><option value="computers">电脑管理与切换</option><option value="pair">连接与配对</option><option value="network">内置远程连接</option><option value="notifications">任务提醒</option><option value="diagnostics">故障诊断</option><option value="schedules">定时任务</option><option value="downloads">下载内容</option><option value="appearance">外观</option><option value="web">App 内网页</option><option value="extensions">未接入扩展功能 · 设计展示</option><option value="about">关于</option></select></label><label>当前页细节<select id="detail"><option value="">页面默认状态</option></select></label><p id="detail-help" class="note" aria-live="polite"></p>
<fieldset id="simulate-receipt" hidden disabled><legend>模拟电脑回执</legend><button data-state="done" type="button">确认已发送</button><button data-state="failed" type="button">明确未发送</button></fieldset>
<label>演示状态<select id="state"><option value="normal">正常</option><option value="quota-error">额度查询失败 · 保留草稿</option><option value="codex-auth">Codex 登录失效 · 电脑已连接</option><option value="codex-timeout">Codex 请求超时 · 电脑已连接</option><option value="quota">Codex 5 小时额度耗尽</option><option value="offline">已配对 · 电脑离线</option><option value="reconnecting">已配对 · 自动重连</option><option value="empty">空列表</option><option value="running">任务执行中 · 禁删</option><option value="starting">任务启动中 · 禁删</option><option value="waiting">等待响应 · 禁删</option><option value="unknown">任务状态未知 · 禁删</option><option value="readonly">只读 · 禁删</option><option value="unsupported">来源不支持删除</option><option value="deleting">删除中</option><option value="delete-failure">删除失败 · 保留会话</option></select></label><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="reload">重新开始</button><p class="note">切换条件会重新开始演示。</p><details class="preview-notes"><summary>演示说明</summary><p class="note">配对码：123456；地址可填 http://preview.invalid。额度与重置次数均为演示数据。</p><p class="note">从“起始页面”和“当前页细节”查看交互。视频可实际播放；授权、通知、上传等原生能力须在真机核对。</p><a href="README.md">范围与校验记录</a></details></aside><main><iframe id="preview" title="G-Collie Flutter 页面" src="flutter/index.html?page=home&state=normal&theme=light&v=filter2"></iframe></main>

<script src="details-catalog.js"></script><script>
const frame=document.getElementById('preview');
const receiptPanel=document.getElementById('simulate-receipt');
receiptPanel.addEventListener('click',event=>{
 const state=event.target.dataset.state;
 if(!ready||!['done','failed'].includes(state))return;
 frame.contentWindow.postMessage(JSON.stringify({type:'prototype:first-send-receipt',state}),location.origin);
 receiptPanel.hidden=true;
 frame.contentWindow.focus();
});
let ready=false;
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data==='prototype:ready'){ready=true;receiptPanel.disabled=false;if(frame.contentWindow.location.search!==location.search)frame.contentWindow.postMessage(JSON.stringify({type:'prototype:navigate',query:new URLSearchParams(location.search).toString()}),location.origin)}});
const ids=['page','detail','state','theme'];
const controls=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
function fillDetails(value=''){
 controls.detail.replaceChildren(new Option('页面默认状态',''));
 for(const item of prototypeDetails.filter(d=>d.page===controls.page.value&&d.detail))if(!Array.from(controls.detail.options).some(o=>o.value===item.detail))controls.detail.add(new Option(item.label,item.detail));
 controls.detail.value=value;
 if(controls.detail.selectedIndex<0)controls.detail.value='';
}
function reload(){
 const params=new URLSearchParams();for(const id of ids)if(controls[id].value)params.set(id,controls[id].value);
 receiptPanel.hidden=controls.page.value!=='chat'||controls.state.value!=='normal'||!['first-send-pending','first-send-unknown'].includes(controls.detail.value);
 const item=prototypeDetails.find(d=>d.page===controls.page.value&&d.detail===controls.detail.value&&d.state===controls.state.value);
 document.getElementById('detail-help').textContent=item?.help||'可从页面内继续操作菜单、表单和返回。';
 history.replaceState(null,'','?'+params.toString());
 if(ready)frame.contentWindow.postMessage(JSON.stringify({type:'prototype:navigate',query:params.toString()}),location.origin);
 else if(!frame.dataset.started){frame.dataset.started='true';frame.src='flutter/index.html?'+params;}
}
for(const id of ids)controls[id].addEventListener('change',()=>{if(id==='page')fillDetails();reload()});
document.getElementById('reload').onclick=reload;
const params=new URLSearchParams(location.search);for(const id of ['page','state','theme'])if(params.has(id)&&Array.from(controls[id].options).some(o=>o.value===params.get(id)))controls[id].value=params.get(id);fillDetails(params.get('detail')||'');reload();
</script></body></html>
