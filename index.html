<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="G-Collie 是开源、自托管的 Agent 会话控制台。在手机或浏览器上新建会话，或继续支持的原会话。Codex、Hermes 和 Claude Code 在自己的电脑上执行。">
  <meta property="og:title" content="G-Collie · Agent 会话控制台">
  <meta property="og:description" content="帮你照看每一个Agent。在手机上继续已有会话或新建会话，任务在你的电脑上执行。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://gigglerobotics.github.io/G-Collie/media/cover.jpg">
  <meta property="og:image:alt" content="G-Collie 电脑与手机接续同一 Agent 会话">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./assets/collie.webp" type="image/webp">
  <link rel="stylesheet" href="./site.css">
  <script defer src="./site.js"></script>
  <title>G-Collie · Agent 会话控制台</title>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="mast"><div class="wrap mast-inner">
  <a class="brand" href="./" aria-label="G-Collie · Agent 会话控制台首页"><img src="./assets/collie.webp" alt="" width="34" height="34"><b>G-Collie</b><span>Agent 会话控制台</span></a>
  <nav aria-label="主导航"><a id="install" href="./start/">首次连接</a><a href="https://github.com/GiggleRobotics/G-Collie">GitHub <span aria-hidden="true">↗</span></a></nav>
</div></header>
<main class="home wrap" id="main">
  <section class="intro" aria-labelledby="title">
    <img class="companion" src="./assets/companion.webp" width="156" height="102" alt="">
    <h1 id="title">帮你照看<br>每一个<span lang="en">Agent</span></h1>
    <p>在手机或浏览器上新建会话，也能在支持的原会话里接着发消息。Codex、Hermes 和 Claude Code 仍在你的电脑上执行。</p>
    <div class="downloads" id="download" aria-label="下载当前公开版本">
      <a class="package primary" href="https://github.com/GiggleRobotics/G-Collie/releases/download/v0.3.35/g-collie_0.3.35_amd64.deb"><span class="download-icon" aria-hidden="true">↓</span><span><b>下载 Linux 电脑端</b><small>DEB · amd64 · 0.3.35</small></span></a>
      <a class="package" href="https://github.com/GiggleRobotics/G-Collie/releases/download/v0.3.35/g-collie-0.1.51-android-arm64-release.apk"><span class="download-icon" aria-hidden="true">↓</span><span><b>下载 Android 手机端</b><small>APK · arm64 · 0.1.51</small></span></a>
    </div>
  </section>
  <section class="demo" id="demo" aria-label="功能演示">
    <div class="film-gallery">
      <div class="preview-pair">
        <img class="desk-shot" src="./assets/demo-desktop.webp" width="1280" height="800" alt="电脑工作台里的报告会话">
        <img class="phone-shot" src="./assets/demo-mobile.webp" width="390" height="844" alt="手机上接着给同一报告发消息">
        <img class="new-shot" src="./assets/new-session-mobile.webp" width="780" height="1688" alt="手机浏览器中选择 Hermes 和项目，新建会话">
        <video class="scene-video" muted playsinline preload="none" aria-label="电脑执行、手机同步，再从手机继续输入"></video>
        <noscript>
          <video class="native-scene native-sync" muted autoplay loop playsinline preload="none" aria-label="电脑执行、手机同步，再从手机继续输入"><source src="./media/session-sync-preview.mp4" type="video/mp4" media="(prefers-reduced-motion: no-preference)"></video>
          <video class="native-scene native-new" muted autoplay loop playsinline preload="none" poster="./assets/new-session-mobile.webp" aria-label="手机浏览器新建会话实录"><source src="./media/new-session.mp4" type="video/mp4" media="(prefers-reduced-motion: no-preference)"></video>
        </noscript>
      </div>
      <fieldset class="film-options">
        <legend class="sr-only">选择演示场景</legend>
        <label class="film-option"><input type="radio" name="scene" value="existing" data-src="./media/session-sync-preview.mp4" data-description="电脑执行、手机同步，再从手机继续输入" checked><span>继续已有会话</span></label>
        <label class="film-option"><input type="radio" name="scene" value="new" data-src="./media/new-session.mp4" data-description="手机浏览器新建会话实录"><span>手机新建会话</span></label>
      </fieldset>
    </div>
  </section>
</main>
<footer class="wrap footing">
  <span>G-Collie · 开源自托管</span>
  <div><a id="agents" href="https://github.com/GiggleRobotics/G-Collie/blob/v0.3.35/docs/能力矩阵.md">助手支持范围</a><a href="https://github.com/GiggleRobotics/G-Collie/releases/tag/v0.3.35">其他安装包与校验 ↗</a></div>
</footer>
</body></html>
